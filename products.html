<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet"> 
</head>
<body>
    <nav>
        <a href="index.html" class="logo">ShopEase</a>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="contact.html">Contact</a></li>
            <!-- <li><a href="cart.html">Cart</a></li> -->
        </ul>
        <div class="search-box">
            <input type="text" class="search-input" placeholder="Search products...">
            <button class="search-btn">Search</button>
            <a href="cart.html" class = "cart-btn ">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class = "cart-count">0</span>
            </a>
            
        </div>
    </nav>
    <!-- <section class="hero" id = "home">
        <div class="hero-content">
            <h1>Welcome to ShopEase</h1>
            <p>Discover amazing products at unbeatable prices!</p>
            <button class = "shop-btn">Shop now</button>
        </div>
    </section> -->
    <section id = "products">
        <h2>Our Products</h2>
        <div class="products">
            <div class="product-card">
                <img src="images/shoe.jpg" class="product-img" alt="Nike Shoes">
                <h3>Nike Shoes</h3>
                <p>⭐⭐⭐⭐</p>
                <p>$299</p>
                <button data-productname data-price data-image>Add to Cart</button>
            </div>
            <div class="product-card">
                <img src="images/headphone.jpg" class="product-img" alt="Headphone">
                <h3>Headphone</h3>
                <p>⭐⭐⭐</p>
                <p>$99</p>
                <button data-productname="Headphone" data-price="99" data-image="images/headphone.jpg">Add to Cart</button>
            </div>
            <div class="product-card">
                <img src="images/laptop.png" class="product-img" alt="Acer Laptop">
                <h3>Acer Laptop</h3>
                <p>⭐⭐⭐⭐</p>
                <p>$349</p>
                <button data-productname="Acer Laptop" data-price="349" data-image="images/laptop.png">Add to Cart</button>
            </div>
            <div class="product-card">
                <img src="images/iphone.jpg" class="product-img" alt="Apple iPhone">
                <h3>Apple iPhone</h3>
                <p>⭐⭐⭐⭐⭐</p>
                <p>$1229</p>
                <button data-productname="Apple iPhone" data-price="1229" data-image="images/iphone.jpg">Add to Cart</button>
            </div>
            <div class="product-card">
                <img src="images/Airpods.webp" class="product-img" alt="AirPods">
                <h3>AirPods</h3>
                <p>⭐⭐⭐⭐</p>
                <p>$199</p>
                <button data-productname="AirPods" data-price="199" data-image="images/Airpods.webp">Add to Cart</button>
            </div>
        </div>
    </section>
   
    <footer class="footer">
        <div class="footer-logo">
            <h2>ShopEase</h2>
        </div>
        <div class="footer-links">
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact</a>
        </div>
        <div class="footer-social">
            <a href="#"><i class="fa-brands fa-facebook"></i></a>
            <a href="#"><i class="fa-brands fa-twitter"></i></a>
            <a href="#"><i class="fa-brands fa-instagram"></i></a>
            <a href="#"><i class="fa-brands fa-linkedin"></i></a>
        </div>
        <p class="copyright">&copy; 2026 ShopEase. All Rights Reserved.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
